<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flavours Dhaba &amp; Family Restaurant – Menu</title>
<style>
:root{--bg:#fbf6ee;--card:#fff;--tx:#241a14;--mu:#7a6a5c;--ac:#c8102e;--gd:#e0a800;--bd:#eadfce;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140d0a;--card:#211612;--tx:#f6ecdd;--mu:#b5a28f;--ac:#ff4d5e;--gd:#ffd23f;--bd:#3a2a22}}
:root[data-theme="dark"]{--bg:#140d0a;--card:#211612;--tx:#f6ecdd;--mu:#b5a28f;--ac:#ff4d5e;--gd:#ffd23f;--bd:#3a2a22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(160deg,#0b1d12,#3a0a12);color:#fff;text-align:center;padding:26px 16px 20px}
header h1{margin:0;font:italic 800 38px/1 Georgia,serif;color:#ffd23f}
header h2{margin:6px 0 4px;font-size:17px;font-weight:700}
header p{margin:2px 0;font-size:13px;opacity:.85}
.call{display:inline-block;margin-top:12px;background:#ffd23f;color:#241a14;text-decoration:none;font-weight:700;padding:9px 16px;border-radius:99px;font-size:14px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--bd)}
#q{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 13px;border-radius:99px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{max-width:640px;margin:0 auto;padding:6px 12px 30px}
section{margin-top:18px}
h3{margin:0 0 8px;font-size:18px;color:var(--ac);border-left:5px solid var(--gd);padding-left:9px}
.it{display:flex;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;margin-bottom:7px;font-size:15px}
.it b{white-space:nowrap;color:var(--ac)}
.it small{color:var(--mu);font-weight:400}
.none{text-align:center;color:var(--mu);padding:30px 0}
footer{text-align:center;color:var(--mu);font-size:12px;padding:0 16px 24px}
[hidden]{display:none!important}
main{padding-bottom:100px}
.it{align-items:center}
.nm{flex:1}
.vs{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.v{display:flex;align-items:center;gap:10px}
.add{border:1.5px solid var(--ac);color:var(--ac);background:transparent;font-weight:700;border-radius:8px;padding:5px 14px;font-size:13px}
.qt{display:inline-flex;align-items:center;background:var(--ac);border-radius:8px;color:#fff}
.qt button{background:none;border:0;color:#fff;font-size:18px;width:30px;height:30px}
.qt i{min-width:18px;text-align:center;font-style:normal;font-weight:700;font-size:14px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:8;background:linear-gradient(transparent,var(--bg) 40%)}
#vb{width:100%;display:flex;justify-content:space-between;background:var(--ac);color:#fff;border:0;border-radius:14px;padding:14px 16px;font-size:15px}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end}
.pn{background:var(--bg);width:100%;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.ph{display:flex;justify-content:space-between;align-items:center}
.ph h3{margin:0}
#cl{background:none;border:0;color:var(--tx);font-size:20px}
.pn input{width:100%;margin-top:8px;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.li span:first-child{flex:1}
.tt{display:flex;justify-content:space-between;font-size:18px;margin:14px 0 10px}
#snd{width:100%;background:#25a244;color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700}
.sec{width:100%;margin-top:8px;background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:11px;font-size:14px}
#po{width:100%;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700}
#snd{margin-top:8px}
#ts{position:fixed;left:12px;right:12px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#25a244;color:#fff;padding:14px;border-radius:12px;z-index:30;text-align:center;font-weight:700}
</style>
</head>
<body>
<header>
<h1>Flavours</h1>
<h2>Dhaba &amp; Family Restaurant</h2>
<p>Good Food · Great Taste · Happy Moments</p>
<p>Goragaon, Chirang, 783373</p>
<a class="call" href="tel:7002089343">📞 7002089343</a>
<a class="call" href="tel:6000950438">📞 6000950438</a>
</header>
<div class="bar">
<input id="q" type="search" placeholder="Search dish… (chicken, biryani, tea)">
<div class="chips" id="chips"></div>
</div>
<main id="m"></main>
<div id="bar" hidden><button id="vb"><span id="bt"></span><b>View Order ›</b></button></div>
<div id="sh" hidden><div class="pn"><div class="ph"><h3>Your Order</h3><button id="cl">✕</button></div>
<div id="lst"></div>
<input id="tbl" placeholder="Table no. (or Takeaway)"><input id="cn" placeholder="Your name (optional)"><input id="nt" placeholder="Note, e.g. less spicy (optional)">
<div class="tt"><span>Total</span><b id="tot"></b></div>
<button id="po">Place Order</button><button id="snd">Or send on WhatsApp</button><button id="cp" class="sec">Copy order text</button></div></div>
<footer>Prices in ₹ · Real Food · Real Flavours · Real Happiness<br>Eat Well, Be Happy</footer>
<script>
var D=[
["Noodles","Veg. Thukpa|130\nPork Thukpa|150\nChicken Thukpa|150\nVeg. Chowmein|110\nEgg Chowmein|130\nChicken Chowmein|180\nPork Chowmein|180\nMix Chowmein|200"],
["Beverages","Cold Coffee|130\nLassi Sweet & Salt|150\nCoffee|50\nBlack Coffee|40\nMilk Tea|20\nBlack Tea|10\nLemon Tea|10\nLemon Juice|80"],
["Salad & Snacks","Green Salad|100\nRoasted Papad|30\nMasala Papad|50\nFry Papad|40\nKaju Fry|220\nPeanut Masala|100\nBlack Chana Fry|100\nBlack Chana Boild|150\nFrench Fry|100\nCorn Fry|150\nCorn Boild|190"],
["Soups","Veg. Hot & Sour Soup|100\nVeg. Manchow Soup|100\nChicken Manchow Soup|130\nChicken Soup|150"],
["Pakora","Veg. Pakora|110\nPaneer Pakora|150\nOnion Pakora|120\nEgg Pakora|130\nChicken Pakora|200\nPork Pakora|200"],
["Rice","Plain Rice|70\nJeera Rice|120\nVeg. Fried Rice|130\nChicken Fried Rice|200\nPork Fried Rice|200\nEgg Fried Rice|170\nMix Fried Rice|230"],
["Pulao & Biryani","Veg. Pulao|170\nChicken Pulao|230\nPork Pulao|250\nMutton Pulao|270\nEgg Pulao|180\nVeg. Biryani|170\nChicken Biryani|230 (B) · 300 (L)\nPork Biryani|250\nMutton Biryani|270\nEgg Biryani|180"],
["Egg","Egg Boiled|30\nEgg Fried|60\nEgg Curry|130\nPoached Omelette|70\nOmelette Masala|70\nEgg Bhurji|80"],
["Roll","Veg. Roll|100\nEgg Roll|120\nChicken Roll|170\nChicken Spring Roll|190"],
["Special Items","Boiled Veg.|160\nBoiled Fish|250\nBoiled Chicken|280\nBoiled Pork|280\nSamo (River Snail)|150\nAmpwo (Larva)|250\nLocal Na (Fish)|250"],
["Indian Food","Chicken Tarka|240 (B) · 270 (L)\nPork Tarka|250\nEgg Tarka|150\nPlain Tarka|100\nPlain Dal|50\nDal Fry|120\nDal Makhani|150\nKadai Paneer|230\nMix Veg.|180\nPaneer Butter Masala|230\nMatar Paneer|220\nAlu Matar|150\nShahi Paneer|240\nChilli Paneer Dry & Gravy|250"],
["Chicken","Liver Pot Dry|220\nLiver Gravy|240\nChicken Dry Fry|230\nKadai Chicken|250\nChicken Curry|240\nChicken B. Masala|250\nChicken Masala|250\nChicken Gravy|240\nChilli Chicken Gravy & Dry|270"],
["Pork","Smoked Pork|230\nOma Kwma, Salai|230\nPork Dry Fry|230\nPork Curry|250\nPork Gravy|260\nChilli Gravy & Dry|270"],
["Fish","Fish Curry|260 (K) · 280 (L)\nFish Fry|250 (K) · 250 (L)\nFish Masala|250 (K) · 280 (L)\nChilli Fish Gravy & Dry|270"],
["Mutton","Mutton Curry|300\nMutton Gravy|300"],
["Roti & Naan","Plain Roti|20\nButter Roti|30\nPlain Naan|40\nButter Naan|50\nGarlic Naan|60"],
["Tandoori","Tandoori Chicken|350"],
["Thali","Veg Thali|200\nChicken Thali|300 (B) · 350 (L)\nPork Thali|300\nMutton Thali|350\nFish Thali|300 · 270 (K) · 290 (L)"]
];
var WA="917002089343",cat="All",cart={},I={},m=document.getElementById("m"),q=document.getElementById("q"),ch=document.getElementById("chips"),$=function(i){return document.getElementById(i)};
D.forEach(function(c,ci){c[2]=c[1].split("\n").map(function(l,li){var p=l.split("|");return {n:p[0],v:p[1].split(" \u00b7 ").map(function(x,vi){var id=ci+"_"+li+"_"+vi,lb=x.replace(/^\d+\s*/,"");I[id]={n:p[0]+(lb?" "+lb:""),p:parseInt(x)};return {id:id,lb:x}})}})});
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function chips(){ch.innerHTML=["All"].concat(D.map(function(c){return c[0]})).map(function(n){return '<button class="chip'+(n==cat?' on':'')+'" data-c="'+esc(n)+'">'+esc(n)+'</button>'}).join("")}
function ctl(id){var n=cart[id]?cart[id].q:0;return n?'<span class="qt"><button data-a="-" data-id="'+id+'">\u2212</button><i>'+n+'</i><button data-a="+" data-id="'+id+'">+</button></span>':'<button class="add" data-a="+" data-id="'+id+'">ADD</button>'}
function tot(){var s=0;for(var k in cart)s+=cart[k].p*cart[k].q;return s}
function cnt(){var s=0;for(var k in cart)s+=cart[k].q;return s}
function draw(){
var t=q.value.trim().toLowerCase(),h="";
D.forEach(function(c){
if(cat!="All"&&cat!=c[0])return;
var r=c[2].filter(function(it){return !t||it.n.toLowerCase().indexOf(t)>-1||c[0].toLowerCase().indexOf(t)>-1});
if(!r.length)return;
h+='<section><h3>'+esc(c[0])+'</h3>'+r.map(function(it){return '<div class="it"><span class="nm">'+esc(it.n)+'</span><div class="vs">'+it.v.map(function(v){return '<div class="v"><b>\u20b9'+esc(v.lb)+'</b>'+ctl(v.id)+'</div>'}).join("")+'</div></div>'}).join("")+'</section>';
});
m.innerHTML=h||'<p class="none">No dish found</p>';
}
function rs(){$("lst").innerHTML=Object.keys(cart).map(function(k){var c=cart[k];return '<div class="li"><span>'+esc(c.n)+'<br><small>\u20b9'+c.p+'</small></span>'+ctl(k)+'<b>\u20b9'+c.p*c.q+'</b></div>'}).join("");$("tot").textContent="\u20b9"+tot()}
function upd(){draw();var n=cnt();$("bar").hidden=!n;$("bt").textContent=n+" item"+(n>1?"s":"")+" \u00b7 \u20b9"+tot();if(!$("sh").hidden){if(n)rs();else $("sh").hidden=true}}
function chg(id,d){var n=(cart[id]?cart[id].q:0)+d;if(n<=0)delete cart[id];else cart[id]={n:I[id].n,p:I[id].p,q:n};upd()}
function msg(){var L=["*New Order \u2013 Flavours Dhaba*","Table: "+($("tbl").value.trim()||"-")],i=0,k,c;
if($("cn").value.trim())L.push("Name: "+$("cn").value.trim());
L.push("");for(k in cart){c=cart[k];L.push((++i)+". "+c.n+" \u00d7 "+c.q+" = \u20b9"+c.p*c.q)}
L.push("","*Total: \u20b9"+tot()+"*");if($("nt").value.trim())L.push("Note: "+$("nt").value.trim());return L.join("\n")}
document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(b)chg(b.getAttribute("data-id"),b.getAttribute("data-a")=="+"?1:-1)});
ch.addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;cat=b.getAttribute("data-c");chips();draw();window.scrollTo(0,0)});
q.addEventListener("input",draw);
$("vb").onclick=function(){rs();$("sh").hidden=false};
$("cl").onclick=function(){$("sh").hidden=true};
$("sh").onclick=function(e){if(e.target==this)this.hidden=true};
$("snd").onclick=function(){if(cnt())location.href="https://wa.me/"+WA+"?text="+encodeURIComponent(msg())};
$("cp").onclick=function(){var b=this;try{navigator.clipboard.writeText(msg());b.textContent="Copied \u2713"}catch(e){}};
chips();draw();
</script>
<div id="ts" hidden></div>
<script type="module">
const CFG={apiKey:"AIzaSyBZNDzKfTejksKWT_cqy35cLN6Eliq-Wys",authDomain:"flavours-dhaba.firebaseapp.com",projectId:"flavours-dhaba",messagingSenderId:"391899369095",appId:"1:391899369095:web:39d7ed4458b57f647e3222"};
const z=n=>String(n).padStart(2,"0"),sl=ms=>new Promise(r=>setTimeout(r,ms));
let fs=null,db=null;
const ready=(async()=>{try{
const A=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
fs=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
const app=A.initializeApp(CFG);
try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch(e){db=fs.getFirestore(app)}
}catch(e){db=null}})();
function toast(s,w){const t=$("ts");t.textContent=s;t.style.background=w?"#d97706":"#25a244";t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true},w?10000:7000)}
function save(pre){const d=new Date(),day=d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
const ref=fs.doc(fs.collection(db,"orders"));
const p=fs.setDoc(ref,{table:$("tbl").value.trim()||"-",name:$("cn").value.trim(),note:(pre+$("nt").value.trim()).trim(),items:Object.keys(cart).map(k=>({n:cart[k].n,p:cart[k].p,q:cart[k].q})),total:tot(),status:"new",createdAt:fs.serverTimestamp(),day:day,month:day.slice(0,7)});
return {id:ref.id.slice(0,5).toUpperCase(),p:p}}
$("po").onclick=async function(){
if(!cnt())return;
if(!$("tbl").value.trim()){alert("Table no. ya Takeaway likhein");$("tbl").focus();return}
const b=this;b.disabled=true;b.textContent="Sending...";
await Promise.race([ready,sl(6000)]);
if(!db){alert("Network bahut slow hai. Neeche 'Or send on WhatsApp' se order bhejein.");b.disabled=false;b.textContent="Place Order";return}
const r=save("");
const ok=await Promise.race([r.p.then(()=>1),sl(4000).then(()=>0)]).catch(()=>-1);
if(ok==-1){alert("Order nahi gaya. WhatsApp se bhejein.");b.disabled=false;b.textContent="Place Order";return}
cart={};upd();$("sh").hidden=true;
if(ok==1)toast("\u2713 Order bhej diya gaya! Order no. "+r.id);
else{toast("\u23f3 Network slow hai. Order save ho gaya (No. "+r.id+"), internet aate hi apne aap chala jayega. Page khula rakhein.",1);r.p.then(()=>toast("\u2713 Order pahunch gaya! Order no. "+r.id)).catch(()=>{})}
b.disabled=false;b.textContent="Place Order";
};
$("snd").onclick=async function(){
if(!cnt())return;
const url="https://wa.me/"+WA+"?text="+encodeURIComponent(msg());
await Promise.race([ready,sl(2500)]);
if(db){const r=save("(WhatsApp) ");r.p.catch(()=>{});await Promise.race([r.p.catch(()=>0),sl(2500)])}
cart={};upd();location.href=url;
};
</script>
</body>
</html>
